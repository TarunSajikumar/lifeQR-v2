<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="LifeQR.png" type="image/png">

    <title>LifeQR — Initializing Secure Network</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..700,0..1,-50..200" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="api-utils.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Archivo', system-ui, -apple-system, sans-serif;
            background: #ffffff;
            color: #111111;
        }
        .font-black {
            font-family: 'Archivo Black', 'Archivo', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.85); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #E11D2E;
            animation: blink 1.4s ease-in-out infinite;
        }
        @keyframes blink {
            50% { opacity: 0.25; }
        }
        .editorial-box {
            border: 2px solid #111111;
            box-shadow: 6px 6px 0px #111111;
        }
        .shimmer-bar {
            background: linear-gradient(90deg, #111111 0%, #E11D2E 50%, #111111 100%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between p-6 sm:p-10 select-none">

    <!-- Top Telemetry Header -->
    <div class="w-full flex items-center justify-between font-mono text-[11px] text-[#111111]">
        <div class="flex items-center gap-2">
            <span class="live-dot"></span>
            <span class="font-bold tracking-widest uppercase">INITIALIZING LIFEQR NETWORK</span>
        </div>
        <div class="hidden sm:block text-[#111111]/50 font-bold uppercase tracking-wider">
            AES-256 GCM ZERO-KNOWLEDGE
        </div>
    </div>

    <!-- Center Logo & Branding -->
    <div class="flex-1 flex flex-col items-center justify-center text-center">
        
        <!-- Animated Icon Container -->
        <div class="relative mb-8">
            <div class="absolute inset-0 bg-[#E11D2E]/20 rounded-2xl pulse-ring"></div>
            <div class="relative w-24 h-24 sm:w-28 sm:h-28 bg-white border-2 border-[#111111] shadow-[6px_6px_0px_#111111] flex items-center justify-center">
                <span class="material-symbols-outlined text-[#E11D2E]" style="font-size: 54px;">
                    medical_services
                </span>
            </div>
        </div>

        <!-- Typography -->
        <div class="space-y-2">
            <div class="flex items-center justify-center gap-2">
                <h1 class="font-black text-4xl sm:text-5xl tracking-tight text-[#111111]">LIFEQR</h1>
                <span class="w-3 h-3 rounded-full bg-[#E11D2E]"></span>
            </div>
            <p class="font-mono text-xs uppercase tracking-widest font-bold text-[#E11D2E]">
                Zero-Latency Emergency Triage Network
            </p>
        </div>

        <!-- Indeterminate Progress Indicator -->
        <div class="w-56 sm:w-64 h-2 border-2 border-[#111111] bg-white mt-10 overflow-hidden p-0.5">
            <div class="h-full w-full shimmer-bar"></div>
        </div>

        <!-- Status Message -->
        <div class="mt-4 flex items-center gap-2 font-mono text-xs font-bold text-[#111111]/80">
            <span class="material-symbols-outlined text-sm animate-spin text-[#E11D2E]">sync</span>
            <span id="loadingStatusText">Connecting to emergency vault...</span>
        </div>

    </div>

    <!-- Bottom Security & Protocol Tag -->
    <div class="w-full flex flex-col sm:flex-row items-center justify-between border-t-2 border-[#111111] pt-4 font-mono text-[11px] text-[#111111]/60">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-sm text-[#111111]">verified_user</span>
            <span class="uppercase tracking-wider font-bold text-[#111111]">END-TO-END ENCRYPTED</span>
        </div>
        <p class="mt-2 sm:mt-0">&copy; 2025&ndash;2026 LifeQR &bull; ALL SYSTEMS OPERATIONAL</p>
    </div>

    <!-- Auto-Redirect Logic -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const noRedirect = urlParams.get('no_redirect') === 'true' || urlParams.get('preview') === 'true';
            const targetOverride = urlParams.get('target');
            const statusEl = document.getElementById('loadingStatusText');

            if (noRedirect) {
                if (statusEl) statusEl.textContent = 'Preview Mode Active';
                return;
            }

            setTimeout(() => {
                if (statusEl) statusEl.textContent = 'Authenticating session token...';
            }, 700);

            setTimeout(() => {
                if (targetOverride) {
                    window.location.href = targetOverride;
                    return;
                }

                // Check stored auth session
                try {
                    const token = localStorage.getItem('token');
                    const userStr = localStorage.getItem('user');

                    if (token && userStr) {
                        const user = JSON.parse(userStr);
                        const role = (user.role || '').toLowerCase();

                        if (role === 'doctor') {
                            window.location.href = 'doctor_dashboard.html';
                            return;
                        } else if (role === 'crew' || role === 'paramedic' || role === 'ambulance') {
                            window.location.href = 'CrewAmbulance_dashboard.html';
                            return;
                        } else if (role === 'er' || role === 'hospital') {
                            window.location.href = 'er_dashboard.html';
                            return;
                        } else if (role === 'admin') {
                            window.location.href = 'admin_dashboard.html';
                            return;
                        } else {
                            window.location.href = 'patient_dashboard.html';
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('Session check fallback:', e);
                }

                // Default destination for unauthenticated visitors
                window.location.href = 'lifeqr_login.html';
            }, 1600);
        })();
    </script>
</body>
</html>
