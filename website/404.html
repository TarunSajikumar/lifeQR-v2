<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Medical Route Not Found | LifeQR</title>
  
  <!-- Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="dist/output.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased relative overflow-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Ambient Specular Background -->
  <div class="ambient-mesh"></div>

  <div class="w-full max-w-md relative z-10 text-center">
    <div class="bezel-shell">
      <div class="bezel-core p-8 sm:p-10 space-y-6">
        
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-600 to-indigo-700 text-white flex items-center justify-center mx-auto shadow-xl shadow-rose-200">
          <span class="material-symbols-outlined text-3xl animate-bounce">heart_broken</span>
        </div>

        <div>
          <span class="font-display text-6xl font-black bg-gradient-to-r from-rose-600 to-indigo-700 bg-clip-text text-transparent block font-tabular">404</span>
          <h1 class="font-display text-2xl font-extrabold text-slate-900 mt-2">Emergency Lifeline Not Found</h1>
          <p class="text-xs sm:text-sm text-slate-500 mt-2 leading-relaxed font-medium">
            The QR profile, medical dashboard route, or triage endpoint you requested does not exist or has been relocated.
          </p>
        </div>

        <div class="pt-2">
          <a href="index.html" class="btn-island btn-island-primary w-full justify-center text-sm py-3.5">
            <span>Return to Safety</span>
            <span class="btn-icon-bubble">
              <span class="material-symbols-outlined text-sm">home</span>
            </span>
          </a>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
